[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metals-mcp-server"
version = "0.1.0"
description = "Production-oriented MCP server for public metals intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "OpenAI", email = "support@openai.com"}
]
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<6",
  "prometheus-client>=0.20,<1",
  "orjson>=3.10,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2"
]
production = [
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "clickhouse-connect>=0.8,<1"
]

[project.scripts]
metals-mcp = "metals_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metals_mcp = [
  "templates/*.j2",
  "resources/*.yaml",
  "fixtures/**/*.json",
  "fixtures/**/*.txt",
  "fixtures/**/*.html",
  "fixtures/**/*.csv",
  "schemas/*.json"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
